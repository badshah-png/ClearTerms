<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearTerms — Understand confusing documents in plain English</title>
    <meta
      name="description"
      content="Paste complicated terms, bills, or agreements and get a clear explanation of what they mean. No account, no storage, privacy-first."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      SECURITY: Content Security Policy.
      - No inline scripts (Vite emits hashed module scripts from 'self').
      - 'unsafe-inline' is allowed ONLY for styles (React style attributes);
        script execution from inline sources is not permitted.
      - object-src/frame-ancestors locked down; base-uri restricted to prevent
        <base> tag injection attacks.
      Additional headers (HSTS, X-Content-Type-Options, Referrer-Policy) are set
      at the hosting layer via public/_headers — see SECURITY.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..700&family=Public+Sans:ital,wght@0,400..800;1,400..600&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <script type="module" src="/src/main.tsx"></script>
  <body>
    <div id="root"></div>
  </body>
</html>
